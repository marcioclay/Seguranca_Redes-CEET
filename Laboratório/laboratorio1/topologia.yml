name: lab
topology:
  nodes:
    firewall:
      kind: linux
      image: wbitt/network-multitool
      binds:
        - ./scripts:/scripts
      exec:
        # Configura o IP na interface voltada para o switch
        - ip addr add 10.0.0.1/24 dev eth1
                

    switch:
      kind: bridge
      

    pc1:
      kind: linux
      image: wbitt/network-multitool
      binds:
        - ./scripts:/scripts
      exec:
        
        - ip addr add 10.0.0.2/24 dev eth1
        

    pc2:
      kind: linux
      image: wbitt/network-multitool
      binds:
        - ./scripts:/scripts
      exec:
         
        - ip addr add 10.0.0.3/24 dev eth1
        

    pc3:
      kind: linux
      image: wbitt/network-multitool 
      binds:
        - ./scripts:/scripts
      exec:
        - ip addr add 10.0.0.4/24 dev eth1
        

  links:
    - endpoints: ["firewall:eth1", "switch:eth1"]
    - endpoints: ["pc1:eth1", "switch:eth2"]
    - endpoints: ["pc2:eth1", "switch:eth3"]
    - endpoints: ["pc3:eth1", "switch:eth4"]
