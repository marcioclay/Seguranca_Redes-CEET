name: lab
topology:
  nodes:
    firewall:
      kind: linux
      image: ubuntu:latest
      binds:
        - ./scripts:/scripts
      exec:
        # Configura o IP na interface voltada para o switch
        - ip addr add 10.0.0.1/24 dev eth1
        # Ativa o encaminhamento de pacotes (roteamento) no kernel
        - sysctl -w net.ipv4.ip_forward=1
        # Ativa o NAT (Masquerade) na interface eth0 (que recebe internet do Containerlab)
        - iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    switch:
      kind: bridge
      image: ubuntu:latest
      

    pc1:
      kind: linux
      image: ubuntu:latest
      binds:
        - ./scripts:/scripts
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip route add default via 10.0.0.1

    pc2:
      kind: linux
      image: ubuntu:latest
      binds:
        - ./scripts:/scripts
      exec:
        - ip addr add 10.0.0.3/24 dev eth1
        - ip route add default via 10.0.0.1

    pc3:
      kind: linux
      image: ubuntu:latest
      binds:
        - ./scripts:/scripts
      exec:
        - ip addr add 10.0.0.4/24 dev eth1
        - ip route add default via 10.0.0.1

  links:
    - endpoints: ["firewall:eth1", "switch:eth1"]
    - endpoints: ["pc1:eth1", "switch:eth2"]
    - endpoints: ["pc2:eth1", "switch:eth3"]
    - endpoints: ["pc3:eth1", "switch:eth4"]
